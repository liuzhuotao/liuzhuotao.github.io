<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fcfbf8">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="preview-banner">Design preview <span aria-hidden="true">·</span> <a href="https://liuzhuotao.github.io/">Current website ↗</a></div>
  <header class="site-header wrap">
    <a class="wordmark" href="{{ .Site.Home.RelPermalink }}" aria-label="Zhuotao Liu homepage">Zhuotao Liu<span class="wordmark-dot" aria-hidden="true">.</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ .Site.Home.RelPermalink }}#news">News</a>
      <a href="{{ .Site.Home.RelPermalink }}#research">Research</a>
      <a href="{{ "publications/" | relURL }}" {{ if eq .Section "publications" }}aria-current="page"{{ end }}>Publications</a>
      <a href="{{ .Site.Home.RelPermalink }}#awards">Awards</a>
      <a href="{{ .Site.Home.RelPermalink }}#service">Service</a>
      <a href="{{ "students/" | relURL }}" {{ if eq .Section "students" }}aria-current="page"{{ end }}>Students</a>
      <a href="{{ "join/" | relURL }}" {{ if eq .Section "join" }}aria-current="page"{{ end }}>Join us</a>
    </nav>
  </header>
  <main id="main" class="wrap">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer wrap">
    <p>© {{ now.Year }} {{ .Site.Title }}</p>
    <a href="mailto:{{ .Site.Data.profile.email }}">{{ .Site.Data.profile.email }}</a>
    <a href="#main">Back to top ↑</a>
  </footer>
</body>
</html>
