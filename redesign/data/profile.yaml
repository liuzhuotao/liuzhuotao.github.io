bio: >-
  I am an Associate Professor and Distinguished Researcher at Tsinghua University,
  where I have led InspiringGroup since 2021. My research spans trustworthy AI,
  secure networked systems, and intelligent network infrastructure. Previously,
  I was a Senior Software Engineer and Technical Lead at Google (2017–2021).
  I received my Ph.D. in Computer Engineering from the University of Illinois
  Urbana-Champaign in 2017 and my B.S. in Electrical and Computer Engineering
  from Shanghai Jiao Tong University in 2012.
research:
  - title: "Trustworthy AI & privacy"
    description: "Secure Transformer inference, private collaborative learning, secure graph computation, and verifiable federated learning."
  - title: "Robust learning for security"
    description: "Traffic analysis, website fingerprinting, and routing anomaly detection that remain effective under changing conditions and adversarial manipulation."
  - title: "Intelligent network infrastructure"
    description: "Machine learning in programmable network devices, high-performance datacenter networks, and network lifecycle automation."
  - title: "Deployable Internet security"
    description: "Practical defenses for Internet routing and DDoS attacks, alongside secure network control and cross-chain interoperability."
