bio: >-
  Researcher in trustworthy AI, secure networked systems, and intelligent network
  infrastructure. Since joining Tsinghua in 2021, Dr. Liu has built an independent research
  program spanning trust-native AI, privacy-preserving computation, robust learning-based
  security, programmable data planes, and secure Internet infrastructure. This work combines
  fundamental algorithms with deployable systems and has earned three Distinguished Paper Awards
  at USENIX Security (2023 and 2024) and ACM CCS (2025), as well as the Internet Defense Prize
  at USENIX Security 2024. Before joining Tsinghua, he led network-infrastructure projects at
  Google and received two Google Feats of Engineering Awards during his four years there. He
  earned his Ph.D. in Computer Engineering from the University of Illinois Urbana-Champaign
  (UIUC) in 2017, and part of his research there won the NSF I-Corps award.
research:
  - title: "Trust-native AI"
    description: "Secure Transformer inference, private collaborative learning, secure graph computation, and verifiable federated learning."
  - title: "Robust Learning for Network Security"
    description: "Traffic analysis, website fingerprinting, and routing anomaly detection that remain effective under changing conditions and adversarial manipulation."
  - title: "Intelligent Network Infrastructure"
    description: "Machine learning in programmable network devices, high-performance datacenter networks, and network lifecycle automation."
  - title: "Deployable and Secure Internet Systems"
    description: "Practical defenses for Internet routing and DDoS attacks, alongside secure network control and cross-chain interoperability."
