name: Deploy website to GitHub Pages

on:
  push:
    branches: ['main']
    paths:
      - 'redesign/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'redesign/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.152.2'
  SITE_URL: 'https://liuzhuotao.github.io/'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Check content and editing workflow
        run: python3 redesign/scripts/check.py

      - name: Build production website
        run: hugo --source redesign --environment production --minify --baseURL "$SITE_URL" --destination public

      - name: Validate the production artifact
        run: python3 redesign/scripts/check.py --output "$GITHUB_WORKSPACE/redesign/public" --base-url "$SITE_URL" --environment production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: redesign/public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
